version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ineco_postgres_db
    environment:
      POSTGRES_DB: gestion_oficinas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_contraseña_aqui
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # FUEZA A POSTGRES A CREAR LAS TABLAS Y EL USUARIO AL ARRANCAR
      - ./src/main/resources/import.sql:/docker-entrypoint-initdb.d/import.sql

  app:
    build: .
    container_name: ineco_gestion_app
    ports:
      - "8082:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/gestion_oficinas_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=tu_contraseña_aqui

volumes:
  postgres_data:
