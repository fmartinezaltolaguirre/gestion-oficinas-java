<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Hito - Ineco</title>
    
    <!-- BLOQUE DE ESTILOS PREMIUM ENCAPSULADO (Blindado contra bloqueos) -->
    <style>
        :root {
            --ineco-blue: #0056b3;
            --dark-elegant: #1e293b;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --border-color: #cbd5e1;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%) !important;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--dark-elegant);
        }

        .main-wrapper {
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .card-form {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
            border-radius: 24px !important;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06) !important;
            padding: 40px;
            box-sizing: border-box;
        }

        .brand-header {
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            margin-bottom: 30px !important;
            border-bottom: 1px solid #e2e8f0 !important;
            padding-bottom: 20px !important;
        }

        .brand-header img {
            max-height: 35px !important;
            object-fit: contain !important;
        }

        .brand-header .title-area h4 {
            margin: 0 !important;
            font-weight: 700 !important;
            color: var(--dark-elegant) !important;
            font-size: 1.25rem !important;
        }

        .brand-header .title-area small {
            color: var(--text-muted) !important;
            font-size: 0.85rem !important;
        }

        .row-grid {
            display: flex !important;
            gap: 20px !important;
        }

        .col-half {
            flex: 1 !important;
        }

        .form-group {
            margin-bottom: 20px !important;
        }

        .form-label-elegant {
            font-size: 0.85rem !important;
            font-weight: 600 !important;
            color: var(--dark-elegant) !important;
            margin-bottom: 8px !important;
            display: block !important;
            letter-spacing: 0.3px !important;
        }

        .form-control-elegant, .form-select-elegant {
            background-color: rgba(248, 250, 252, 0.8) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 12px !important;
            padding: 12px 16px !important;
            font-size: 0.95rem !important;
            color: var(--dark-elegant) !important;
            width: 100% !important;
            box-sizing: border-box !important;
            transition: all 0.25s ease !important;
        }

        .form-select-elegant {
            appearance: none !important;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://w3.org' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23344155' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3cvg%3e") !important;
            background-repeat: no-repeat !important;
            background-position: right 16px center !important;
            background-size: 12px !important;
            padding-right: 40px !important;
            cursor: pointer !important;
        }

        .btn-container {
            display: flex !important;
            justify-content: flex-end !important;
            gap: 12px !important;
            margin-top: 32px !important;
            border-top: 1px solid #e2e8f0 !important;
            padding-top: 20px !important;
        }

        .btn-elegant {
            font-weight: 500 !important;
            font-size: 0.95rem !important;
            padding: 12px 24px !important;
            border-radius: 12px !important;
            border: none !important;
            cursor: pointer !important;
            text-decoration: none !important;
            display: inline-flex !important;
            align-items: center !important;
        }

        .btn-light-elegant {
            background-color: #f1f5f9 !important;
            color: var(--dark-elegant) !important;
            border: 1px solid #e2e8f0 !important;
        }

        .btn-dark-elegant {
            background-color: var(--dark-elegant) !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.15) !important;
        }

        .back-link {
            display: inline-flex !important;
            align-items: center !important;
            color: var(--text-muted) !important;
            font-size: 0.85rem !important;
            text-decoration: none !important;
            margin-bottom: 16px !important;
        }

        @media (max-width: 576px) {
            .row-grid { flex-direction: column !important; gap: 0 !important; }
        }
    </style>
</head>
<body>

    <!-- Cargamos la barra superior unificada -->
    <div th:replace="~{fragments/navbar :: menuCorporativo('alertas')}"></div>
    <div class="main-wrapper">
        <div class="container">
            <a href="/gestion-oficinas/alertas" class="back-link">← Volver al calendario técnico</a>
            
            <div class="card card-form">
                <div class="brand-header">
                    <img th:src="@{/images/Logo_Ineco.jpg}" alt="Ineco Logo">
                    <div class="title-area">
                        <h4>Alta de Hito / Vencimiento</h4>
                        <small>Programación de plazos legales, alertas de obra y asignación de prioridad</small>
                    </div>
                </div>

                <form th:action="@{/alertas/guardar}" th:object="${alerta}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="form-group">
                        <label for="titulo" class="form-label-elegant">Denominación del Hito Legal</label>
                        <input type="text" id="titulo" th:field="*{titulo}" class="form-control-elegant" placeholder="Ej: Fin de Plazo de Alegaciones Jurídicas" required>
                    </div>

                    <div class="form-group">
                        <label for="descripcion" class="form-label-elegant">Descripción o Notas de Alerta</label>
                        <input type="text" id="descripcion" th:field="*{descripcion}" class="form-control-elegant" placeholder="Detalles específicos del hito...">
                    </div>

                    <div class="row-grid">
                        <div class="col-half form-group">
                            <label for="fechaVencimiento" class="form-label-elegant">Fecha de Vencimiento</label>
                            <input type="date" id="fechaVencimiento" th:field="*{fechaVencimiento}" class="form-control-elegant" required>
                        </div>
                        <div class="col-half form-group">
                            <label for="criticidad" class="form-label-elegant">Nivel de Prioridad / Criticidad</label>
                            <select id="criticidad" th:field="*{criticidad}" class="form-select-elegant" required>
                                <option value="BAJA">Informativa (Baja)</option>
                                <option value="MEDIA">Importante (Media)</option>
                                <option value="ALTA">Urgente (Alta)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="proyecto" class="form-label-elegant">Proyecto Técnico Asociado</label>
                        <select id="proyecto" th:field="*{proyecto}" class="form-select-elegant" required>
                            <option value="" disabled selected>Seleccione el expediente vinculado...</option>
                            <option th:each="pr : ${proyectos}" th:value="${pr.id}" th:text="${pr.nombre} + ' (' + ${pr.codigoExpediente} + ')'"></option>
                        </select>
                    </div>

                    <div class="btn-container">
                        <a href="/gestion-oficinas/alertas" class="btn btn-elegant btn-light-elegant">Cancelar</a>
                        <button type="submit" class="btn btn-elegant btn-dark-elegant">Registrar Hito</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
