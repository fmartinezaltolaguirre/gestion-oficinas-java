<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Técnico - Ineco</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        .navbar-ineco {
            background-color: #0056b3;
        }
        .wrapper {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .card-form {
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="wrapper">

    <!-- Barra de Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-ineco shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">ineco</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/oficinas}"><i class="bi bi-building"></i> Oficinas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/usuarios}"><i class="bi bi-people"></i> Usuarios</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-white me-3" th:text="${#authentication.name}">Usuario</span>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-right"></i> Salir</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido del Formulario -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <a th:href="@{/usuarios}" class="btn btn-sm btn-link text-secondary mb-3 p-0 text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Volver al panel de personal
                </a>

                <div class="card card-form shadow-sm p-4 bg-white">
                    <h3 class="fw-bold text-dark mb-1">Dar de Alta Operador Técnico</h3>
                    <p class="text-muted mb-4 text-sm">Registre credenciales del empleado. La contraseña se cifrará automáticamente por seguridad.</p>

                    <!-- Alerta si hay duplicados -->
                    <div th:if="${error}" class="alert alert-danger p-2 text-center text-sm mb-4" role="alert" th:text="${error}">
                        Error al procesar el usuario.
                    </div>

                    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                        
                        <!-- Nombre Completo -->
                        <div class="mb-3">
                            <label for="nombreCompleto" class="form-label text-secondary fw-semibold">Nombre y Apellidos</label>
                            <input type="text" id="nombreCompleto" th:field="*{nombreCompleto}" class="form-control" placeholder="Ej: Maria Gómez Pérez" required>
                        </div>

                        <div class="row">
                            <!-- Nombre de Usuario / Login -->
                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label text-secondary fw-semibold">Usuario de Red (Login)</label>
                                <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="ej: mgomez" required>
                            </div>
                            
                            <!-- Contraseña -->
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label text-secondary fw-semibold">Contraseña Inicial</label>
                                <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Asignación de Oficina -->
                            <div class="col-md-6 mb-4">
                                <label for="oficina" class="form-label text-secondary fw-semibold">Oficina Técnica Adscrita</label>
                                <select id="oficina" th:field="*{oficina}" class="form-select" required>
                                    <option value="" disabled selected>Seleccione una sede...</option>
                                    <!-- Carga dinámicamente las oficinas existentes -->
                                    <option th:each="of : ${oficinas}" th:value="${of.id}" th:text="${of.nombre}"></option>
                                </select>
                            </div>

                            <!-- Rol del Sistema -->
                            <div class="col-md-6 mb-4">
                                <label for="rol" class="form-label text-secondary fw-semibold">Rol de Autorización</label>
                                <select id="rol" th:field="*{rol}" class="form-select" required>
                                    <option value="ROLE_CONSULTOR">Consultor Técnico (Lectura/Escritura)</option>
                                    <option value="ROLE_ADMIN">Administrador General (Control Total)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex justify-content-end gap-2 border-top pt-3">
                            <a th:href="@{/usuarios}" class="btn btn-light px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">Guardar Alta</button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://jsdelivr.net"></script>
</body>
</html>
