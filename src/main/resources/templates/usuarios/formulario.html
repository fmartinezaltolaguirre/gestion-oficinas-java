<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Personal Técnico - Ineco</title>
    <!-- Estilos y fuentes profesionales -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        :root { --ineco-blue: #0056b3; }
        body { background-color: #f4f7f6; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar-ineco { background-color: var(--ineco-blue); }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .form-control:focus, .form-select:focus { border-color: var(--ineco-blue); box-shadow: 0 0 0 0.25px rgba(0,86,179,0.25); }
        .input-group-text { background-color: #f8f9fa; color: #6c757d; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-ineco shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/gestion-oficinas/oficinas">ineco</a>
        </div>
    </nav>

    <!-- Contenedor del Formulario -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <a href="/gestion-oficinas/usuarios" class="btn btn-sm btn-link text-secondary text-decoration-none mb-3">
                    <i class="bi bi-arrow-left-circle-fill"></i> Volver al panel de personal
                </a>

                <div class="card card-custom p-4 bg-white">
                    <div class="d-flex align-items-center mb-4 border-bottom pb-3">
                        <div class="bg-success bg-opacity-10 p-3 rounded-3 text-success me-3">
                            <i class="bi bi-person-vcard fs-3"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold text-dark mb-0">Alta de Personal Técnico</h4>
                            <small class="text-muted">Registro de credenciales para el control de accesos e informes de red.</small>
                        </div>
                    </div>

                    <!-- Alerta de Errores -->
                    <div th:if="${error}" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                        <i class="bi bi-exclamation-octagon-fill me-2"></i>
                        <div th:text="${error}">Error al procesar</div>
                    </div>

                    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                        
                        <!-- Nombre Completo -->
                        <div class="mb-4">
                            <label for="nombreCompleto" class="form-label fw-semibold text-secondary">Nombre y Apellidos</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                <input type="text" id="nombreCompleto" th:field="*{nombreCompleto}" class="form-control" placeholder="Ej: Juan Pérez Expósito" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <!-- Nombre de Usuario (Login) -->
                            <div class="col-md-6">
                                <label for="username" class="form-label fw-semibold text-secondary">Usuario de Red (Login)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-badge-fill"></i></span>
                                    <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="ej: jpexposito" required>
                                </div>
                            </div>
                            
                            <!-- Contraseña -->
                            <div class="col-md-6">
                                <label for="password" class="form-label fw-semibold text-secondary">Contraseña de Acceso</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <!-- Desplegable dinámico de Oficinas Técnicas -->
                            <div class="col-md-6">
                                <label for="oficina" class="form-label fw-semibold text-secondary">Sede Técnico-Administrativa</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-geo-fill"></i></span>
                                    <select id="oficina" th:field="*{oficina}" class="form-select" required>
                                        <option value="" disabled selected th:text="'Seleccione destino...'">Seleccione destino...</option>
                                        <option th:each="of : ${oficinas}" th:value="${of.id}" th:text="${of.nombre}"></option>
                                    </select>
                                </div>
                            </div>

                            <!-- Desplegable de Roles -->
                            <div class="col-md-6">
                                <label for="rol" class="form-label fw-semibold text-secondary">Rol de Permisos</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                                    <select id="rol" th:field="*{rol}" class="form-select" required>
                                        <option value="ROLE_CONSULTOR">Consultor Área (Lectura/Escritura)</option>
                                        <option value="ROLE_ADMIN">Administrador Ineco (Control Total)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Botones Operativos -->
                        <div class="d-flex justify-content-end gap-2 border-top pt-3">
                            <a href="/gestion-oficinas/usuarios" class="btn btn-light px-4 border">Cancelar</a>
                            <button type="submit" class="btn btn-success px-4 fw-semibold shadow-sm">
                                <i class="bi bi-person-check-fill me-1"></i> Habilitar Cuenta
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

<script src="https://jsdelivr.net"></script>
</body>
</html>
