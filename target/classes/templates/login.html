<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Ineco Gestión</title>
    <!-- Bootstrap 5 CDN Oficial -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Iconos oficiales de Bootstrap -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    
    <style>
        :root {
            --ineco-blue: #0056b3;
            --dark-elegant: #1e293b;
            --text-muted: #64748b;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            transition: all 0.3s ease;
        }

        .logo-area img {
            max-height: 48px;
            object-fit: contain;
            filter: grayscale(10%) contrast(105%);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .form-label-elegant {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark-elegant);
            margin-bottom: 6px;
            display: block;
            letter-spacing: 0.3px;
        }

        .input-elegant-container {
            position: relative;
            margin-bottom: 20px;
        }

        .input-elegant-container i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
            transition: color 0.2s ease;
        }

        .form-control-elegant {
            background-color: rgba(248, 250, 252, 0.7);
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px 16px 12px 46px;
            font-size: 0.95rem;
            color: var(--dark-elegant);
            height: auto;
            transition: all 0.25s ease;
        }

        .form-control-elegant:focus {
            background-color: #ffffff;
            border-color: var(--ineco-blue);
            box-shadow: 0 0 0 4px rgba(0, 86, 179, 0.1);
            outline: none;
        }

        .form-control-elegant:focus + i {
            color: var(--ineco-blue);
        }

        .btn-elegant {
            background-color: var(--dark-elegant);
            color: #ffffff;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 14px;
            border-radius: 12px;
            border: none;
            width: 100%;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.15);
        }

        .btn-elegant:hover {
            background-color: #0f172a;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(30, 41, 59, 0.25);
            transform: translateY(-1px);
        }

        .btn-elegant:active {
            transform: translateY(1px);
        }

        .alert-elegant {
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: #991b1b;
            border-radius: 12px;
            font-size: 0.85rem;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        
        .alert-elegant-success {
            background-color: #f0fdf4;
            border: 1px solid #dcfce7;
            color: #166534;
        }

        .footer-text {
            color: #94a3b8;
            font-size: 0.75rem;
            margin-top: 32px;
            text-align: center;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>

<div class="login-card">
    
    <!-- Encabezado Limpio y Centrado -->
    <div class="logo-area text-center mb-4">
        <img th:src="@{/images/Logo_Ineco.jpg}" 
             alt="Ineco Corporativo" 
             class="img-fluid">
        <div class="mt-3">
            <span class="subtitle">Gestión de Oficinas</span>
        </div>
    </div>

    <!-- Alerta: Credenciales Incorrectas -->
    <div th:if="${param.error}" class="alert-elegant" role="alert">
        <i class="bi bi-exclamation-circle-fill fs-5"></i>
        <div>El usuario o la contraseña no coinciden con los registros.</div>
    </div>

    <!-- Alerta: Cierre de Sesión exitoso -->
    <div th:if="${param.logout}" class="alert-elegant alert-elegant-success" role="alert">
        <i class="bi bi-check-circle-fill fs-5"></i>
        <div>La sesión se ha cerrado correctamente.</div>
    </div>

    <!-- Formulario Elegante -->
    <form th:action="@{/login}" method="post">
        
        <div class="mb-3">
            <label for="username" class="form-label-elegant">Usuario corporativo</label>
            <div class="input-elegant-container">
                <input type="text" 
                       id="username" 
                       name="username" 
                       class="form-control form-control-elegant" 
                       placeholder="Introduzca su usuario" 
                       required 
                       autofocus>
                <i class="bi bi-person"></i>
            </div>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label-elegant">Contraseña</label>
            <div class="input-elegant-container">
                <input type="password" 
                       id="password" 
                       name="password" 
                       class="form-control form-control-elegant" 
                       placeholder="••••••••" 
                       required>
                <i class="bi bi-lock"></i>
            </div>
        </div>

        <!-- Botón Minimalista Oscuro -->
        <button type="submit" class="btn btn-elegant">
            Acceder al Sistema
        </button>
        
    </form>

    <!-- Footer Discreto -->
    <div class="footer-text">
        © 2026 Ineco. Entorno de Gestión Técnica.
    </div>
</div>

<script src="https://jsdelivr.net"></script>
</body>
</html>
