<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Oficina - Ineco</title>
    
    <!-- BLOQUE DE ESTILOS PREMIUM INTEGRADO -->
    <style>
        :root {
            --ineco-blue: #0056b3;
            --dark-elegant: #1e293b;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --border-color: #cbd5e1;
        }
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--dark-elegant);
        }
        .main-wrapper {
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
        }
        .card-form {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
            padding: 40px;
            box-sizing: border-box;
        }
        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 20px;
        }
        .brand-header img {
            max-height: 35px;
            object-fit: contain;
        }
        .brand-header .title-area h4 {
            margin: 0;
            font-weight: 700;
            color: var(--dark-elegant);
            font-size: 1.25rem;
        }
        .brand-header .title-area small {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label-elegant {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark-elegant);
            margin-bottom: 8px;
            display: block;
            letter-spacing: 0.3px;
        }
        .form-control-elegant {
            background-color: rgba(248, 250, 252, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: var(--dark-elegant);
            width: 100%;
            box-sizing: border-box;
            transition: all 0.25s ease;
        }
        .form-control-elegant:focus {
            background-color: #ffffff;
            border-color: var(--ineco-blue);
            box-shadow: 0 0 0 4px rgba(0, 86, 179, 0.1);
            outline: none;
        }
        .btn-container {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 32px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }
        .btn-elegant {
            font-weight: 500;
            font-size: 0.95rem;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .btn-light-elegant {
            background-color: #f1f5f9;
            color: var(--dark-elegant);
            border: 1px solid #e2e8f0;
        }
        .btn-light-elegant:hover {
            background-color: #e2e8f0;
        }
        .btn-dark-elegant {
            background-color: var(--dark-elegant);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.15);
        }
        .btn-dark-elegant:hover {
            background-color: #0f172a;
            box-shadow: 0 6px 20px rgba(30, 41, 59, 0.25);
            transform: translateY(-1px);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            margin-bottom: 16px;
            transition: color 0.2s ease;
        }
        .back-link:hover {
            color: var(--ineco-blue);
        }
    </style>
</head>
<body>

    <!-- Vinculamos la barra común marcando activa la sección de oficinas -->
    <div th:replace="~{fragments/navbar :: menuCorporativo('oficinas')}"></div>

    <div class="main-wrapper">
        <div class="container">
            <a href="/gestion-oficinas/oficinas" class="back-link">← Volver al listado corporativo</a>
            
            <div class="card card-form">
                <div class="brand-header">
                    <img th:src="@{/images/Logo_Ineco.jpg}" alt="Ineco Logo">
                    <div class="title-area">
                        <h4 th:text="${oficina.id == null} ? 'Registrar Oficina Técnica' : 'Modificar Parámetros de Sede'">Formulario</h4>
                        <small>Mapeo de delegaciones territoriales e infraestructuras locales</small>
                    </div>
                </div>

                <form th:action="@{/oficinas/guardar}" th:object="${oficina}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="form-group">
                        <label for="codigoOficina" class="form-label-elegant">Código Interno de Sede</label>
                        <input type="text" id="codigoOficina" th:field="*{codigoOficina}" class="form-control-elegant" style="text-transform: uppercase;" placeholder="Ej: OFI-LUG" required>
                    </div>

                    <div class="form-group">
                        <label for="nombre" class="form-label-elegant">Nombre Oficial de la Oficina</label>
                        <input type="text" id="nombre" th:field="*{nombre}" class="form-control-elegant" placeholder="Ej: Delegación Provincial de Lugo" required>
                    </div>

                    <div class="form-group">
                        <label for="ubicacion" class="form-label-elegant">Ubicación / Región Terrenal</label>
                        <input type="text" id="ubicacion" th:field="*{ubicacion}" class="form-control-elegant" placeholder="Ej: Plaza de la Xunta S/N, Galicia">
                    </div>

                    <div class="btn-container">
                        <a href="/gestion-oficinas/oficinas" class="btn btn-elegant btn-light-elegant">Cancelar</a>
                        <button type="submit" class="btn btn-elegant btn-dark-elegant" th:text="${oficina.id == null} ? 'Confirmar Registro' : 'Actualizar Cambios'">
                            Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
