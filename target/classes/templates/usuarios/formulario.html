<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Personal Técnico - Ineco</title>
    
    <!-- BLOQUE DE ESTILOS ELEGANTES INTEGRADO (Independiente de Internet) -->
    <style>
        :root {
            --ineco-blue: #0056b3;
            --dark-elegant: #1e293b;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --border-color: #cbd5e1;
            --success-color: #10b981;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--dark-elegant);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .card-form {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
            padding: 40px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 20px;
        }

        .brand-header img {
            max-height: 35px;
            object-fit: contain;
        }

        .brand-header .title-area h4 {
            margin: 0;
            font-weight: 700;
            color: var(--dark-elegant);
            font-size: 1.25rem;
        }

        .brand-header .title-area small {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .row-grid {
            display: flex;
            gap: 20px;
        }

        .col-half {
            flex: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label-elegant {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark-elegant);
            margin-bottom: 8px;
            display: block;
            letter-spacing: 0.3px;
        }

        .form-control-elegant, .form-select-elegant {
            background-color: rgba(248, 250, 252, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: var(--dark-elegant);
            width: 100%;
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        .form-select-elegant {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://w3.org' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23344155' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3cvg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 12px;
            padding-right: 40px;
            cursor: pointer;
        }

        .form-control-elegant:focus, .form-select-elegant:focus {
            background-color: #ffffff;
            border-color: var(--ineco-blue);
            box-shadow: 0 0 0 4px rgba(0, 86, 179, 0.1);
            outline: none;
        }

        .btn-container {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 32px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }

        .btn-elegant {
            font-weight: 500;
            font-size: 0.95rem;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .btn-light-elegant {
            background-color: #f1f5f9;
            color: var(--dark-elegant);
            border: 1px solid #e2e8f0;
        }

        .btn-light-elegant:hover {
            background-color: #e2e8f0;
        }

        .btn-success-elegant {
            background-color: var(--success-color);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
        }

        .btn-success-elegant:hover {
            background-color: #059669;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.25);
            transform: translateY(-1px);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            margin-bottom: 16px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--ineco-blue);
        }

        /* Soporte responsive básico para el grid de columnas */
        @media (max-width: 576px) {
            .row-grid {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Enlace Volver atrás -->
    <a href="/gestion-oficinas/usuarios" class="back-link">
        ← Volver al panel de personal
    </a>

    <div class="card card-form">
        
        <!-- Cabecera Corporativa -->
        <div class="brand-header">
            <img th:src="@{/images/Logo_Ineco.jpg}" alt="Ineco Logo">
            <div class="title-area">
                <h4>Alta de Personal Técnico</h4>
                <small>Registro de credenciales para el control de accesos e informes de red</small>
            </div>
        </div>

        <!-- Alerta de Errores Duplicados -->
        <div th:if="${error}" style="background-color: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; padding: 12px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 20px;" th:text="${error}">
            Error al procesar
        </div>

        <!-- Formulario Técnico -->
        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
            
            <!-- Nombre Completo -->
            <div class="form-group">
                <label for="nombreCompleto" class="form-label-elegant">Nombre y Apellidos</label>
                <input type="text" 
                       id="nombreCompleto" 
                       th:field="*{nombreCompleto}" 
                       class="form-control-elegant" 
                       placeholder="Ej: Juan Pérez Expósito" 
                       required>
            </div>

            <!-- Fila Duplicada: Login y Password -->
            <div class="row-grid">
                <div class="col-half form-group">
                    <label for="username" class="form-label-elegant">Usuario de Red (Login)</label>
                    <input type="text" 
                           id="username" 
                           th:field="*{username}" 
                           class="form-control-elegant" 
                           placeholder="ej: jpexposito" 
                           required>
                </div>
                
                <div class="col-half form-group">
                    <label for="password" class="form-label-elegant">Contraseña de Acceso</label>
                    <input type="password" 
                           id="password" 
                           th:field="*{password}" 
                           class="form-control-elegant" 
                           placeholder="••••••••" 
                           required>
                </div>
            </div>

            <!-- Fila Duplicada: Sede y Rol -->
            <div class="row-grid">
                <div class="col-half form-group">
                    <label for="oficina" class="form-label-elegant">Sede Técnico-Administrativa</label>
                    <select id="oficina" th:field="*{oficina}" class="form-select-elegant" required>
                        <option value="" disabled selected>Seleccione destino...</option>
                        <option th:each="of : ${oficinas}" th:value="${of.id}" th:text="${of.nombre}"></option>
                    </select>
                </div>

                <div class="col-half form-group">
                    <label for="rol" class="form-label-elegant">Rol de Permisos</label>
                    <select id="rol" th:field="*{rol}" class="form-select-elegant" required>
                        <option value="ROLE_CONSULTOR">Consultor Área (Lectura/Escritura)</option>
                        <option value="ROLE_ADMIN">Administrador Ineco (Control Total)</option>
                    </select>
                </div>
            </div>

            <!-- Botones de Acción Estilizados -->
            <div class="btn-container">
                <a href="/gestion-oficinas/usuarios" class="btn btn-elegant btn-light-elegant">Cancelar</a>
                <button type="submit" class="btn btn-elegant btn-success-elegant">
                    Habilitar Cuenta
                </button>
            </div>
            
        </form>
    </div>
</div>

</body>
</html>
